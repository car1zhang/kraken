<svg viewBox="0 0 860 200" role="img" aria-label="legacy fragment carrying a flow dot">
  <defs>
    <marker id="arrow-warnsmil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <text class="title" x="16" y="30">legacy animation warns once, never fails</text>
  <g class="node">
    <rect x="60" y="70" width="200" height="60" rx="8"/>
    <text x="160" y="104">left box</text>
  </g>
  <g class="node">
    <rect x="560" y="70" width="200" height="60" rx="8"/>
    <text x="660" y="104">right box</text>
  </g>
  <path id="warnsmil-e1" class="edge" d="M 260,100 H 560" marker-end="url(#arrow-warnsmil)"/>
  <circle class="flow-dot" r="4">
    <animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath href="#warnsmil-e1"/></animateMotion>
  </circle>
  <circle class="flow-dot" r="4">
    <animateMotion dur="3s" repeatCount="indefinite" begin="-1.5s"><mpath href="#warnsmil-e1"/></animateMotion>
  </circle>
</svg>
