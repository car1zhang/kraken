<svg viewBox="0 0 860 380" role="img" aria-label="Markdown pipeline data model">
  <defs>
    <marker id="arrow-md-pipeline" class="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" />
    </marker>
  </defs>

  <!-- Left: markdown source -->
  <rect class="node" x="20" y="100" width="140" height="64" rx="7" />
  <text class="node" x="90" y="124" text-anchor="middle" font-size="13">markdown source</text>
  <text x="90" y="140" text-anchor="middle" font-size="11" opacity="0.7">line-oriented</text>
  <text x="90" y="153" text-anchor="middle" font-size="11" opacity="0.7">single pass</text>

  <!-- Center: MarkdownBlock enum group -->
  <rect class="group" x="200" y="30" width="400" height="210" rx="9" />
  <text class="group" x="216" y="52" font-size="13">[MarkdownBlock] (enum, pure values)</text>

  <rect class="store" x="216" y="66" width="177" height="40" rx="5" />
  <text class="store" x="305" y="90" text-anchor="middle" font-size="12">heading(level, inline)</text>

  <rect class="store" x="407" y="66" width="177" height="40" rx="5" />
  <text class="store" x="496" y="90" text-anchor="middle" font-size="12">paragraph(inline)</text>

  <rect class="store" x="216" y="120" width="177" height="40" rx="5" />
  <text class="store" x="305" y="144" text-anchor="middle" font-size="12">list(ordered, items)</text>

  <rect class="store" x="407" y="120" width="177" height="40" rx="5" />
  <text class="store" x="496" y="144" text-anchor="middle" font-size="12">codeFence(text)</text>

  <rect class="store" x="216" y="174" width="177" height="40" rx="5" />
  <text class="store" x="305" y="198" text-anchor="middle" font-size="12">blockquote(inline)</text>

  <rect class="store" x="407" y="174" width="177" height="40" rx="5" />
  <text class="store" x="496" y="188" text-anchor="middle" font-size="12">table(header,<tspan x="496" dy="1.2em">aligns, rows)</tspan></text>

  <!-- Below: inline pass -->
  <rect class="node" x="300" y="290" width="200" height="58" rx="7" />
  <text class="node" x="400" y="310" text-anchor="middle" font-size="13">inline pass</text>
  <text x="400" y="326" text-anchor="middle" font-size="11" opacity="0.7">escape first, then</text>
  <text x="400" y="339" text-anchor="middle" font-size="11" opacity="0.7">`code` ** * [links]</text>

  <!-- Right: two consumers -->
  <rect class="node accent" x="660" y="70" width="190" height="68" rx="7" />
  <text class="node" x="755" y="100" text-anchor="middle" font-size="13">native renderer →</text>
  <text class="node" x="755" y="118" text-anchor="middle" font-size="13">SwiftUI views</text>

  <rect class="node" x="660" y="175" width="190" height="72" rx="7" />
  <text class="node" x="755" y="205" text-anchor="middle" font-size="13">HTML renderer →</text>
  <text class="node" x="755" y="223" text-anchor="middle" font-size="13">dark shell (ArtifactView)</text>

  <!-- Edges -->
  <path id="mp-parse" class="edge" d="M160,132 L196,134" marker-end="url(#arrow-md-pipeline)" fill="none" />
  <text class="edgeLabel" x="180" y="122" text-anchor="middle" font-size="12">parse</text>

  <path id="mp-group-native" class="edge" d="M600,110 C630,110 632,104 656,104" marker-end="url(#arrow-md-pipeline)" fill="none" />
  <text class="edgeLabel" x="628" y="96" text-anchor="middle" font-size="12">render native</text>

  <path id="mp-group-html" class="edge" d="M600,150 C632,150 636,211 656,211" marker-end="url(#arrow-md-pipeline)" fill="none" />
  <text class="edgeLabel" x="628" y="178" text-anchor="middle" font-size="12">render HTML</text>

  <path id="mp-group-inline" class="edge" d="M400,240 L400,286" marker-end="url(#arrow-md-pipeline)" fill="none" />
  <text class="edgeLabel" x="470" y="268" text-anchor="middle" font-size="12">per inline span</text>
</svg>
