<svg viewBox="0 0 860 300" role="img" aria-label="One yellow box that never says what its colour means, beside every shape of treated markup that is allowed to stay silent: a box stating its own glyph, a box covered by an adjacent pill, a bar, a region and a treated edge.">
  <text class="title" x="16" y="26">a treated box that states no glyph reads as decoration</text>

  <g class="node yellow">
    <rect x="40" y="60" width="240" height="52" rx="8"/>
    <text x="160" y="92">retry budget</text>
  </g>

  <g class="node green">
    <rect x="310" y="60" width="240" height="52" rx="8"/>
    <text x="430" y="92">✓ ci green</text>
  </g>

  <g class="node red">
    <rect x="580" y="60" width="240" height="52" rx="8"/>
    <text x="700" y="92">upload step</text>
  </g>

  <g class="pill red">
    <rect x="640" y="122" width="120" height="24" rx="12"/>
    <text x="700" y="139">✗ failing</text>
  </g>

  <g class="node purple">
    <rect x="580" y="160" width="240" height="52" rx="8"/>
    <text x="700" y="192">✓ shipped</text>
  </g>

  <g class="bar purple">
    <rect x="40" y="170" width="240" height="18" rx="4"/>
  </g>

  <g class="region grey">
    <rect x="310" y="160" width="240" height="70" rx="6"/>
    <text x="324" y="182">retired lane</text>
  </g>

  <path class="edge blue" d="M 40,260 H 280"/>
</svg>
