<svg viewBox="0 0 860 300" role="img" aria-label="The six treatments — grey, red, yellow, green, blue, purple — each on its own node stating the glyph the contract pairs it with, plus the one legal stacking in the palette: grey with dim.">
  <text class="title" x="16" y="26">every treatment states its glyph, so colour is never the only channel</text>

  <g class="node grey">
    <rect x="40" y="60" width="240" height="52" rx="8"/>
    <text x="160" y="92">∅ removed</text>
  </g>

  <g class="node red">
    <rect x="310" y="60" width="240" height="52" rx="8"/>
    <text x="430" y="92">✗ broken</text>
  </g>

  <g class="node yellow">
    <rect x="580" y="60" width="240" height="52" rx="8"/>
    <text x="700" y="92">⚠ suspect</text>
  </g>

  <g class="node green">
    <rect x="40" y="150" width="240" height="52" rx="8"/>
    <text x="160" y="182">✓ passing</text>
  </g>

  <g class="node blue">
    <rect x="310" y="150" width="240" height="52" rx="8"/>
    <text x="430" y="182">+ added</text>
  </g>

  <g class="node purple">
    <rect x="580" y="150" width="240" height="52" rx="8"/>
    <text x="700" y="182">★ unusual</text>
  </g>

  <g class="node grey dim">
    <rect x="40" y="230" width="240" height="52" rx="8"/>
    <text x="160" y="262">∅ off-story</text>
  </g>
</svg>
