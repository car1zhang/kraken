    <text x="190" y="71">jobs</text>
    <g class="proc">
      <rect x="56" y="92" width="120" height="50" rx="2"/>
      <rect x="60" y="96" width="112" height="42" rx="1"/>
      <text x="116" y="121">serve</text>
    </g>
  </g>
</svg>
