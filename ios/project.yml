name: Kraken
options:
  bundleIdPrefix: dev.carl
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  Kraken:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Kraken
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.carl.Kraken
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Kraken
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The phone-to-Mac hop (`k web --tailnet`) is plain HTTP; ATS would
        # refuse it without this. That hop never leaves the tailnet, which is
        # WireGuard-encrypted end to end — this does not expose the app to
        # the public internet.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
