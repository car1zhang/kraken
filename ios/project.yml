name: Kraken
options:
  bundleIdPrefix: dev.carl
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  Kraken:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Kraken
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.carl.Kraken
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DDUUFX5L3W  # carl set this via Xcode for device signing
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Kraken
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # kraken://board, kraken://board/<column>, kraken://overview,
        # kraken://job/<slug>, kraken://sessions, kraken://session/<pane>,
        # kraken://settings — parsed by AppRouter, handled via .onOpenURL.
        CFBundleURLTypes:
          - CFBundleURLName: dev.carl.Kraken
            CFBundleURLSchemes:
              - kraken
        # The phone-to-Mac hop (`k web --tailnet`) is plain HTTP; ATS would
        # refuse it without this. That hop never leaves the tailnet, which is
        # WireGuard-encrypted end to end — this does not expose the app to
        # the public internet.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # "job blocked" local notifications (no APNs — needs a paid dev
        # account carl doesn't have): BGAppRefreshTask polls the board and
        # fires a local notification for newly-blocked jobs. See
        # NotificationManager.swift.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.carl.Kraken.refresh
  KrakenUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KrakenUITests
    dependencies:
      - target: Kraken
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.carl.KrakenUITests
        SWIFT_VERSION: "5.10"
        TEST_TARGET_NAME: Kraken
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kraken:
    build:
      targets:
        Kraken: all
        KrakenUITests: [test]
    test:
      targets:
        - KrakenUITests
