<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kraken</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    // pre-paint theme stamp: preference (localStorage kraken-theme: "light" |
    // "dark", absent = follow system) resolves against prefers-color-scheme
    // and lands on <html data-theme>; failure modes fall through to the dark
    // :root defaults. window.krakenTheme is the toggle's tiny API (app.js).
    (function () {
      // storage can throw (blocked cookies, sandboxed context) — a dead
      // store must still leave the theme working for this page load
      var pref;
      try { pref = localStorage.getItem("kraken-theme"); } catch (e) {}
      if (pref !== "light" && pref !== "dark") pref = "system";
      var mq = window.matchMedia("(prefers-color-scheme: light)");
      function stamp() {
        document.documentElement.dataset.theme =
          pref === "system" ? (mq.matches ? "light" : "dark") : pref;
      }
      stamp();
      window.krakenTheme = {
        get: function () { return pref; },
        set: function (p) {
          pref = p === "light" || p === "dark" ? p : "system";
          stamp();
          try {
            if (pref === "system") localStorage.removeItem("kraken-theme");
            else localStorage.setItem("kraken-theme", pref);
          } catch (e) {}
        },
      };
      mq.addEventListener("change", function () { if (pref === "system") stamp(); });
    })();
  </script>
  <script>
    // Its own <script> block, deliberately: an uncaught throw in the theme
    // IIFE above (e.g. a browser without MediaQueryList.addEventListener)
    // aborts only ITS script, so the HUD stamps below still run — one shared
    // block would take both down together.
    //
    // pre-paint HUD stamps, same posture as the theme above: accent palette
    // (localStorage kraken-accent → <html data-accent>, absent/violet = no
    // attribute, so the :root violet defaults apply) and the CRT scanlines
    // (localStorage kraken-scanlines: "off" → <html data-scanlines="off">,
    // which style.css uses to hide the .scan element). Pre-paint because a
    // React-mounted stamp would flash violet-with-scanlines first; a dead
    // localStorage leaves both at their defaults.
    (function () {
      var ACCENTS = ["violet", "cyan", "amber", "crimson", "green"];
      var accent, scan;
      try {
        accent = localStorage.getItem("kraken-accent");
        scan = localStorage.getItem("kraken-scanlines");
      } catch (e) {}
      if (ACCENTS.indexOf(accent) < 0) accent = "violet";
      function stampAccent() {
        if (accent === "violet") delete document.documentElement.dataset.accent;
        else document.documentElement.dataset.accent = accent;
      }
      function stampScan() {
        if (scan === "off") document.documentElement.dataset.scanlines = "off";
        else delete document.documentElement.dataset.scanlines;
      }
      stampAccent();
      stampScan();
      window.krakenHud = {
        accents: ACCENTS.slice(),
        getAccent: function () { return accent; },
        setAccent: function (a) {
          accent = ACCENTS.indexOf(a) >= 0 ? a : "violet";
          stampAccent();
          try {
            if (accent === "violet") localStorage.removeItem("kraken-accent");
            else localStorage.setItem("kraken-accent", accent);
          } catch (e) {}
        },
        getScanlines: function () { return scan !== "off"; },
        setScanlines: function (on) {
          scan = on ? "on" : "off";
          stampScan();
          try {
            if (on) localStorage.removeItem("kraken-scanlines");
            else localStorage.setItem("kraken-scanlines", "off");
          } catch (e) {}
        },
      };
    })();
  </script>
</head>
<body>
  <div class="scan" aria-hidden="true"></div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
