<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kraken</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    // pre-paint theme stamp: preference (localStorage kraken-theme: "light" |
    // "dark", absent = follow system) resolves against prefers-color-scheme
    // and lands on <html data-theme>; failure modes fall through to the dark
    // :root defaults. window.krakenTheme is the toggle's tiny API (app.js).
    (function () {
      // storage can throw (blocked cookies, sandboxed context) — a dead
      // store must still leave the theme working for this page load
      var pref;
      try { pref = localStorage.getItem("kraken-theme"); } catch (e) {}
      if (pref !== "light" && pref !== "dark") pref = "system";
      var mq = window.matchMedia("(prefers-color-scheme: light)");
      function stamp() {
        document.documentElement.dataset.theme =
          pref === "system" ? (mq.matches ? "light" : "dark") : pref;
      }
      stamp();
      window.krakenTheme = {
        get: function () { return pref; },
        set: function (p) {
          pref = p === "light" || p === "dark" ? p : "system";
          stamp();
          try {
            if (pref === "system") localStorage.removeItem("kraken-theme");
            else localStorage.setItem("kraken-theme", pref);
          } catch (e) {}
        },
      };
      mq.addEventListener("change", function () { if (pref === "system") stamp(); });
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scan" aria-hidden="true"></div>

  <header class="chrome">
    <span class="mark">KRAKEN<i>▊</i></span>
    <span class="led" id="daemon-led"></span>
    <span class="stat" id="daemon-stat">connecting…</span>
    <span class="stat" id="cells-stat"></span>
    <span class="stat hot" id="flag-stat"></span>
    <span class="usage-stat" id="usage-stat" hidden role="button" tabindex="0" title="usage — claude code pool"></span>
    <span class="viewtabs">
      <button class="viewtab active" data-view="board">BOARD</button>
      <button class="viewtab" data-view="dag">DAG</button>
      <button class="viewtab" data-view="log">LOG</button>
    </span>
    <span class="spacer"></span>
    <button class="theme-btn" id="theme-toggle" title="theme: system → light → dark"></button>
    <span class="stat dim" id="tick-stat"></span>
  </header>
  <div class="stale-banner" id="stale-banner" hidden></div>

  <main class="board" id="board"></main>
  <main class="dag" id="dag" hidden>
    <div class="dag-canvas" id="dag-canvas">
      <svg id="dag-edges"></svg>
      <div id="dag-nodes"></div>
    </div>
  </main>
  <!-- unified event log: newest at the bottom; scrolling to the top pulls
       the previous (older) log file into view, one file per fetch -->
  <main class="logview" id="log" hidden>
    <div class="log-scroll" id="log-scroll">
      <div class="log-more" id="log-more" hidden>· scroll up for older ·</div>
      <div id="log-entries"><div class="log-empty">no log entries yet</div></div>
    </div>
  </main>

  <!-- artifact viewer -->
  <div class="overlay" id="overlay" hidden>
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title" id="panel-title"></span>
        <span class="spacer"></span>
        <button class="btn ghost" id="panel-open">↗ tab</button>
        <button class="btn ghost" id="panel-raw">raw</button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </div>
  </div>

  <!-- message zeus: mid-run instructions to a live cell; the same modal
       doubles as the reactivate prompt (optional message), and is also what
       clicking into a live working/blocked job's card opens — its spec
       renders alongside the composer, collapsed by default. for
       steer/unblock modes it's action-complete: the head's tmux/mark-done
       buttons plus #steer-actions' retry/question buttons cover whatever the
       card itself would show, so nothing is card-only. overlay outside-click
       and Escape (see app.js) are the only way to close it now -->
  <div class="overlay" id="steer-overlay" hidden>
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title" id="steer-title"></span>
        <span class="spacer"></span>
        <button class="btn tmux-open open-tmux" id="steer-tmux" hidden title="raise zeus' pane in Ghostty">⧉ tmux</button>
        <button class="btn steer-done" id="steer-markdone" hidden title="mark this job done">✓ mark done</button>
        <button class="btn ghost danger" id="steer-kill" hidden>✕ cancel job</button>
      </div>
      <div class="panel-body answer-body">
        <div class="steer-context" id="steer-context" hidden>
          <div class="steer-crew" id="steer-crew" hidden></div>
          <div class="prs" id="steer-prs" hidden></div>
          <div class="steer-detail" id="steer-detail" hidden></div>
          <div class="last-sent" id="steer-lastsent" hidden></div>
          <div class="chips" id="steer-chips" hidden></div>
        </div>
        <div class="steer-actions" id="steer-actions" hidden></div>
        <div class="steer-spec" id="steer-spec" hidden>
          <button class="steer-spec-head" id="steer-spec-toggle"><span class="tri">▸</span> spec</button>
          <div class="steer-spec-body" id="steer-spec-body" hidden></div>
        </div>
        <div class="cmd-chips" id="steer-cmd-chips"></div>
        <div class="cmd-hl-wrap" id="steer-text-wrap">
          <div class="cmd-hl-backdrop" id="steer-text-backdrop" aria-hidden="true"></div>
          <textarea id="steer-text" rows="4"
            placeholder="message zeus directly — steering / pivot instruction, delivered straight to its pane"></textarea>
        </div>
        <div class="att-zone" id="steer-att-zone">
          <div class="att-chips" id="steer-chips-att" hidden></div>
          <div class="att-bar">
            <button class="btn ghost att-btn" id="steer-att-btn" type="button" title="attach images">📎 attach</button>
            <span class="att-hint">paste (⌘V) or drop images</span>
            <input type="file" id="steer-att-input" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
          </div>
        </div>
        <button class="btn btn-big" id="steer-send">send ⌘⏎</button>
        <div class="answer-note" id="steer-note"></div>
      </div>
    </div>
  </div>

  <!-- usage drilldown: claude code pool usage, opened from the header widget.
       Same overlay/panel structure as the artifact viewer, but static markup
       (like steer/editor) since it's a fixed, non-job-scoped modal. -->
  <div class="overlay" id="usage-overlay" hidden>
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">usage — claude code pool</span>
        <span class="stat dim" id="usage-fetched"></span>
        <span class="spacer"></span>
      </div>
      <div class="panel-body" id="usage-body"></div>
    </div>
  </div>

  <!-- job editor: draft + spec authoring in the browser; also the read-only
       viewer for a started-but-dead job (no live cell to steer) -->
  <div class="overlay" id="editor-overlay" hidden>
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title" id="editor-title"></span>
        <span class="stat dim" id="editor-hint"></span>
        <span class="spacer"></span>
        <button class="btn ghost" id="editor-reactivate" hidden
          title="resume this done job's original zeus session in a fresh cell">↺ reactivate</button>
        <button class="btn ghost" id="editor-archive" hidden
          title="move this job (and its preserved artifacts) into the archive — frees the slug; reversible from the ARCHIVED drawer under DONE">archive</button>
        <button class="btn ghost" id="editor-dequeue" hidden
          title="cancel — return this queued job to draft (spec is kept)">✕ cancel queue</button>
        <button class="btn" id="editor-queue" hidden
          title="mark this job ready and queue it — same move as dragging the card to QUEUED">queue ⌘⏎</button>
      </div>
      <div class="panel-body editor-body">
        <div class="editor-newrow" id="editor-newrow" hidden>
          <input id="editor-slug" placeholder="job-slug" spellcheck="false">
          <button class="btn" id="editor-create">create</button>
        </div>
        <div class="editor-form" id="editor-form" hidden>
          <div class="f-row">
            <label>type
              <select id="f-type">
                <option>build</option><option>info</option>
              </select>
            </label>
            <label>repo <select id="f-repo"></select></label>
            <label>base <input id="f-base" placeholder="origin/main" spellcheck="false"></label>
            <label>model <input id="f-model" list="model-list" placeholder="default" spellcheck="false"
              title="claude model for zeus (--model value) — applied once at cell start"></label>
            <span class="f-toggles">
              <label class="check"><input type="checkbox" id="f-solo"> solo</label>
              <label class="check"><input type="checkbox" id="f-skipdoc"
                title="build only: skip the /aim → /do phase — zeus implements the spec directly"> skip doc</label>
            </span>
          </div>
          <div class="f-block">
            <span class="f-label">prereqs <button class="mini-add" id="f-add-prereq">+ add</button></span>
            <div id="f-prereqs"></div>
          </div>
          <div class="cmd-chips" id="editor-cmd-chips"></div>
          <label class="f-block grow" for="editor-text">spec — zeus' initial prompt, as fleshed out as possible
            <div class="cmd-hl-wrap" id="editor-text-wrap">
              <div class="cmd-hl-backdrop" id="editor-text-backdrop" aria-hidden="true"></div>
              <textarea id="editor-text" spellcheck="false"></textarea>
            </div>
          </label>
          <div class="att-zone" id="editor-att-zone">
            <div class="att-chips" id="editor-chips-att" hidden></div>
            <div class="att-bar">
              <button class="btn ghost att-btn" id="editor-att-btn" type="button" title="attach images">📎 attach</button>
              <span class="att-hint">paste (⌘V) or drop images</span>
              <input type="file" id="editor-att-input" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
            </div>
          </div>
        </div>
        <div class="answer-note" id="editor-note"></div>
      </div>
      <datalist id="job-list"></datalist>
      <datalist id="model-list">
        <option value="fable"><option value="opus"><option value="sonnet"><option value="haiku">
      </datalist>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
