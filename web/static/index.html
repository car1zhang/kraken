<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kraken</title>
  <script>
    // pre-paint theme stamp: preference (localStorage kraken-theme: "light" |
    // "dark", absent = follow system) resolves against prefers-color-scheme
    // and lands on <html data-theme>; failure modes fall through to the dark
    // :root defaults. window.krakenTheme is the toggle's tiny API (app.js).
    (function () {
      // storage can throw (blocked cookies, sandboxed context) — a dead
      // store must still leave the theme working for this page load
      var pref;
      try { pref = localStorage.getItem("kraken-theme"); } catch (e) {}
      if (pref !== "light" && pref !== "dark") pref = "system";
      var mq = window.matchMedia("(prefers-color-scheme: light)");
      function stamp() {
        document.documentElement.dataset.theme =
          pref === "system" ? (mq.matches ? "light" : "dark") : pref;
      }
      stamp();
      window.krakenTheme = {
        get: function () { return pref; },
        set: function (p) {
          pref = p === "light" || p === "dark" ? p : "system";
          stamp();
          try {
            if (pref === "system") localStorage.removeItem("kraken-theme");
            else localStorage.setItem("kraken-theme", pref);
          } catch (e) {}
        },
      };
      mq.addEventListener("change", function () { if (pref === "system") stamp(); });
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scan" aria-hidden="true"></div>

  <header class="chrome">
    <span class="mark">KRAKEN<i>▊</i></span>
    <span class="led" id="daemon-led"></span>
    <span class="stat" id="daemon-stat">connecting…</span>
    <span class="stat" id="cells-stat"></span>
    <span class="stat hot" id="flag-stat"></span>
    <span class="viewtabs">
      <button class="viewtab active" data-view="board">BOARD</button>
      <button class="viewtab" data-view="dag">DAG</button>
    </span>
    <span class="spacer"></span>
    <button class="theme-btn" id="theme-toggle" title="theme: system → light → dark"></button>
    <span class="stat dim" id="tick-stat"></span>
  </header>
  <div class="stale-banner" id="stale-banner" hidden></div>

  <main class="board" id="board"></main>
  <main class="dag" id="dag" hidden>
    <div class="dag-canvas" id="dag-canvas">
      <svg id="dag-edges"></svg>
      <div id="dag-nodes"></div>
    </div>
  </main>

  <!-- artifact viewer -->
  <div class="overlay" id="overlay" hidden>
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title" id="panel-title"></span>
        <span class="spacer"></span>
        <button class="btn ghost" id="panel-open">↗ tab</button>
        <button class="btn ghost" id="panel-raw">raw</button>
        <button class="btn" id="panel-close">close ✕</button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </div>
  </div>

  <!-- message zeus: mid-run instructions to a live cell; the same modal
       doubles as the reactivate prompt (optional message), and is also what
       clicking into a live working/blocked job's card opens — its frozen
       spec renders alongside the composer, collapsed by default. for
       steer/unblock modes it's action-complete: #steer-actions holds
       whatever tmux/retry/mark-done/question buttons the card itself would
       show, so nothing is card-only -->
  <div class="overlay" id="steer-overlay" hidden>
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title" id="steer-title"></span>
        <span class="spacer"></span>
        <button class="btn ghost danger" id="steer-kill" hidden>✕ cancel job</button>
        <button class="btn ghost" id="steer-cancel">cancel</button>
        <button class="btn" id="steer-send">send ⌘⏎</button>
      </div>
      <div class="panel-body answer-body">
        <div class="steer-context" id="steer-context" hidden>
          <div class="steer-detail" id="steer-detail" hidden></div>
          <div class="last-sent" id="steer-lastsent" hidden></div>
          <div class="chips" id="steer-chips" hidden></div>
        </div>
        <div class="steer-actions" id="steer-actions" hidden></div>
        <div class="steer-spec" id="steer-spec" hidden>
          <button class="steer-spec-head" id="steer-spec-toggle"><span class="tri">▸</span> spec — ❄ frozen while the cell runs · display only</button>
          <div class="steer-spec-body" id="steer-spec-body" hidden></div>
        </div>
        <textarea id="steer-text" rows="4"
          placeholder="message zeus directly — steering / pivot instruction, delivered straight to its pane"></textarea>
        <div class="answer-note" id="steer-note"></div>
      </div>
    </div>
  </div>

  <!-- job editor: draft + spec authoring in the browser; also the read-only
       viewer for a started-but-dead job (no live cell to steer) -->
  <div class="overlay" id="editor-overlay" hidden>
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title" id="editor-title"></span>
        <span class="stat dim" id="editor-hint"></span>
        <span class="spacer"></span>
        <button class="btn ghost danger" id="editor-force" hidden>overwrite disk</button>
        <button class="btn ghost" id="editor-queue" hidden
          title="queue this draft — same move as dragging the card to QUEUED">▶ queue</button>
        <button class="btn ghost" id="editor-reactivate" hidden
          title="resume this done job's original zeus session in a fresh cell">↺ reactivate</button>
        <button class="btn ghost" id="editor-archive" hidden
          title="move this job (and its preserved artifacts) into the archive — frees the slug; reversible from the ARCHIVED drawer under DONE">archive</button>
        <button class="btn ghost" id="editor-cancel">cancel</button>
        <button class="btn" id="editor-save">save ⌘⏎</button>
      </div>
      <div class="panel-body editor-body">
        <div class="editor-newrow" id="editor-newrow" hidden>
          <input id="editor-slug" placeholder="job-slug" spellcheck="false">
          <button class="btn" id="editor-create">create</button>
        </div>
        <div class="editor-form" id="editor-form" hidden>
          <div class="f-row">
            <label>type
              <select id="f-type">
                <option>build</option><option>info</option>
              </select>
            </label>
            <label>repo <select id="f-repo"></select></label>
            <label>base <input id="f-base" placeholder="origin/main" spellcheck="false"></label>
            <span class="f-toggles">
              <label class="check"><input type="checkbox" id="f-ready"> ready</label>
              <label class="check"><input type="checkbox" id="f-solo"> solo</label>
              <label class="check"><input type="checkbox" id="f-auto"> auto-approve</label>
            </span>
          </div>
          <div class="f-block">
            <span class="f-label">prereqs <button class="mini-add" id="f-add-prereq">+ add</button></span>
            <div id="f-prereqs"></div>
          </div>
          <label class="f-block grow">spec — zeus' initial prompt, as fleshed out as possible
            <textarea id="editor-text" spellcheck="false"></textarea>
          </label>
        </div>
        <div class="answer-note" id="editor-note"></div>
      </div>
      <datalist id="job-list"></datalist>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
